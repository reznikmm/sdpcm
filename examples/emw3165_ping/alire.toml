name = "emw3165_ping"
description = "Ping example with ENet IP stack for EMW3165 (STM32F411/BCM43362)"
version = "0.1.0-dev"

authors = ["Max Reznik"]
maintainers = ["Max Reznik <reznikmm@gmail.com>"]
maintainers-logins = ["reznikmm"]
licenses = "MIT"
website = ""
tags = []

executables = ["emw3165_ping"]

[build-switches]
development.optimization = ["-O0"]
development.style_checks = ["-gnaty"]
development.contracts = "Yes"
"*".debug_info = "Yes"

[configuration]
generate_ada = false
generate_c = false

[[depends-on]]
light_tasking_stm32f4xx = "^16.0.0-dev"
aa_stm32_drivers = "~0.1.0"
gnat_arm_elf = "^16.1.0"
enet_bcm43362 = "~0.1.0-dev"

[build-profiles]
"*" = "development"

[[pins]]
aa_stm32_drivers = { url="https://github.com/reznikmm/aa_stm32_drivers" }
light_tasking_stm32f4xx = { url="https://github.com/reznikmm/community-bb-runtimes", subdir="light-tasking-stm32f4xx", branch="16.0.0" }
enet_bcm43362 = { path='../../enet_bcm43362' }
sdpcm = { path='../..' }
enet = { url='https://github.com/reznikmm/ada-enet', branch='topic/headroom' }

[[actions]]
type = "post-build"
command = ["arm-eabi-objcopy", "-Obinary", "emw3165_ping", "emw3165_ping.bin"]
directory = "bin"

[configuration.values]
aa_stm32_drivers.aa_mcu = "stm32f411"
enet.Default_Random = "none"

light_tasking_stm32f4xx.MCU_Sub_Family      = "F411"
# Configure a 26 MHz HSE crystal oscillator
light_tasking_stm32f4xx.HSE_Clock_Frequency = 26_000_000

# Select the PLL as the SYSCLK source, driven from HSE
light_tasking_stm32f4xx.SYSCLK_Src = "PLL"
light_tasking_stm32f4xx.PLL_Src = "HSE"

# Configure the PLL VCO to run at 400 MHz from the 25 MHz HSE
# (fVCO = fHSE * (N/M) = 25 MHz * (192/12) = 400 MHz)
light_tasking_stm32f4xx.PLL_M_Div = 13
light_tasking_stm32f4xx.PLL_N_Mul = 100

# Configure the PLL P output (SYSCLK) to run at 100 MHz from the 400 MHz VCO
light_tasking_stm32f4xx.PLL_P_Div = "DIV2"

# Configure the AHB, APB1 and APB2 prescalers
light_tasking_stm32f4xx.AHB_Pre  = "DIV1"
light_tasking_stm32f4xx.APB1_Pre = "DIV2"
light_tasking_stm32f4xx.APB2_Pre = "DIV1"

